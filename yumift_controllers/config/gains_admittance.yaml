# Gains for individual right admittances
IR:
  K_P: 3.0     # Gain for positional error
  K_O: 6.0   # Gain for angular error
  # Force admittance
  F_M: [2.5, 2.5, 2.5]
  F_D: [75, 75, 75]
  F_K: [0, 0, 0]
  # Torque admittance
  T_M: [100000, 100000, 100000]
  T_D: [50000, 50000, 50000]
  T_K: [0, 0, 0]
# Gains for individual left admittances
IL:
  K_P: 3.0   # Gain for positional error
  K_O: 0.0   # Gain for angular error
  # Force admittance
  # F_M: [200, 200, 200]
  F_M: [2.0, 2.0, 2.0]
  F_D: [40, 40, 40]  # critical damping --> D = 2*sqrt(M*K)
  F_K: [200, 200, 200]
  # Torque admittance
  # T_M: [5, 5, 5]
  # T_D: [7, 7, 7]  # critical damping --> D = 2*sqrt(M*K)
  # T_K: [10, 10, 10]
  T_M: [100000, 100000, 100000]
  T_D: [50000, 50000, 50000]
  T_K: [0, 0, 0]
# Gains for coordinated absolute admittances
CA:
  K_P: 2.0
  K_O: 4.0
  F_M: [3, 3, 3]
  F_D: [9.5, 9.5, 9.5]
  F_K: [30, 30, 30]
  T_M: [10, 10, 2]
  T_D: [450, 450, 65]
  T_K: [20000, 20000, 2000]
# Gains for coordinated relative admittances
CR:
  K_P: 2.0
  K_O: 4.0
  F_M: [1000, 1000, 1000]
  F_D: [3150, 3150, 3150]
  F_K: [10000, 10000, 10000]
  T_M: [10, 10, 2]
  T_D: [450, 450, 65]
  T_K: [20000, 20000, 2000]
# Minimum error to take action
MIN_ACTION: [0.005, 0.017453]  # [lin, ang]  #deg2rad(1)
# Maximum deviation in target
MAX_DEVIATION: [0.500, 1.7453]  # [lin, ang]  #deg2rad(100)
